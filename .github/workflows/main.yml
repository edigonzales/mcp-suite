name: verify and publish
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE_NAME: mcp-suite
  IMAGE_VERSION: 0.0.${{ github.run_number }}-${{ github.run_attempt }}
  BUILD_NUMBER: ${{ github.run_number }}
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and verify canonical artifacts once
        run: ./gradlew --no-daemon clean check bootJar
      - name: Check out the NETL synthetic runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: edigonzales/netl-mcp
          path: netl-runtime
      - name: Start the independent NETL runtime and exercise the suite from its container
        run: |
          export NETL_HOST_WORKSPACE="$GITHUB_WORKSPACE/netl-runtime/tests/compose/workspace"
          mkdir -p "$NETL_HOST_WORKSPACE/.netl"
          chmod -R a+rwX "$NETL_HOST_WORKSPACE"
          docker compose -f netl-runtime/tests/compose/compose.yaml up -d --build --wait edit-db pub-db gretl
          docker build -f docker/Dockerfile -t suite-container-check:ci .
          python3 netl-runtime/tools/netl-container-check.py --kind suite --image suite-container-check:ci --workspace netl-runtime/tests/compose/workspace
      - name: Stop only the synthetic runtime
        if: always()
        run: NETL_HOST_WORKSPACE="$GITHUB_WORKSPACE/netl-runtime/tests/compose/workspace" docker compose -f netl-runtime/tests/compose/compose.yaml down --volumes
      - name: Archive the exact canonical artifacts with their paths
        run: tar -czf canonical-artifacts.tar.gz build/libs/mcp-suite.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-artifacts
          path: canonical-artifacts.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: test-reports
          path: build/reports/
  images:
    needs: application
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: canonical-artifacts
          path: .
      - name: Restore canonical paths
        run: tar -xzf canonical-artifacts.tar.gz
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build using the same canonical JAR on each architecture
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: mcp-verified:ci
          build-args: |
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=mcp-suite-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=mcp-suite-${{ matrix.architecture }}
      - name: Verify HTTP, STDIO, catalogs, parallel responses and exact JAR
        run: python3 tools/check-image.py --kind suite --image mcp-verified:ci --workspace tests/fixture --catalog build/http-catalog.json --jar build/libs/mcp-suite.jar
      - name: Compare the complete suite contract with both published standalone servers
        run: |
          python3 tools/check-image.py --kind interlis --image sogis/interlis-mcp:latest --catalog build/interlis-catalog.json
          python3 tools/check-image.py --kind netl --image sogis/netl-mcp:latest --workspace tests/fixture --catalog build/netl-catalog.json
          python3 tools/compare-catalogs.py build/interlis-catalog.json build/netl-catalog.json build/http-catalog.json
      - name: Export the verified image without rebuilding
        run: docker save mcp-verified:ci | gzip > verified-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-image-${{ matrix.architecture }}
          path: verified-image.tar.gz
          compression-level: 0
  publish:
    needs: [application, images]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: canonical-artifacts
          path: .
      - name: Restore canonical paths
        run: tar -xzf canonical-artifacts.tar.gz
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: verified-image-*
          path: verified-images
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified images, verify both registries, then update latest
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for architecture in amd64 arm64; do
            docker load < "verified-images/verified-image-$architecture/verified-image.tar.gz"
            for image in "docker.io/sogis/$IMAGE_NAME" "ghcr.io/$owner/$IMAGE_NAME"; do
              docker tag mcp-verified:ci "$image:$IMAGE_VERSION-$architecture"
              docker push "$image:$IMAGE_VERSION-$architecture"
            done
          done
          for image in "docker.io/sogis/$IMAGE_NAME" "ghcr.io/$owner/$IMAGE_NAME"; do
            docker buildx imagetools create --tag "$image:$IMAGE_VERSION" "$image:$IMAGE_VERSION-amd64" "$image:$IMAGE_VERSION-arm64"
            docker buildx imagetools inspect --raw "$image:$IMAGE_VERSION" > manifest.json
            python3 tools/verify-image-manifest.py manifest.json
          done
          for image in "docker.io/sogis/$IMAGE_NAME" "ghcr.io/$owner/$IMAGE_NAME"; do
            docker buildx imagetools create --tag "$image:latest" "$image:$IMAGE_VERSION"
            docker buildx imagetools inspect --raw "$image:latest" > manifest.json
            python3 tools/verify-image-manifest.py manifest.json
          done
